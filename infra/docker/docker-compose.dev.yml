# Local-only docker-compose. Brings up Postgres (with pgvector) and Temporal.
# Production runs on AWS-managed equivalents (RDS, Temporal Cloud).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: overturn
      POSTGRES_PASSWORD: overturn
      POSTGRES_DB: overturn
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overturn"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.0
    depends_on: [postgres]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: overturn
      POSTGRES_PWD: overturn
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.27.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8233:8080"]

volumes:
  pgdata:
