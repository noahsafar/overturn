name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @claimwell/db generate
      - run: pnpm --filter @claimwell/shared test
      - run: pnpm --filter @claimwell/prompts test
      - run: pnpm --filter @claimwell/db test
      - run: pnpm --filter @claimwell/web typecheck

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      - run: cd apps/worker && uv pip install --system -e ".[dev]"
      - run: cd apps/worker && pytest -q
