[project]
name = "overturn-worker"
version = "0.1.0"
description = "Claimwell Temporal worker + internal FastAPI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "temporalio>=1.7.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.7.0",
  "anthropic>=0.39.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]
era = ["pyx12>=2.3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overturn_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
